[package]
name = "freeze-authority-sample-manual"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "8dfb80eed7fc259ca8afc7b7c2a9349eb49f9d44" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", branch = "fix/drop-instruction-shim" }
freeze-authority = { path = "../freeze-authority" }

[dev-dependencies]
spel-framework-core = { git = "https://github.com/mmlado/spel.git", rev = "8dfb80eed7fc259ca8afc7b7c2a9349eb49f9d44", features = ["idl-gen"] }
