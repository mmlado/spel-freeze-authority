[package]
name = "consumer-fixture-guest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "consumer_fixture"
path = "src/bin/consumer_fixture.rs"

[dependencies]
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "bbd887728d6c00accccbade5941256e8a43af6b6" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", rev = "e0df2c83f727e6718ff4b7895c98972d561ba1a2" }
freeze-authority = { git = "https://github.com/mmlado/spel-freeze-authority.git", branch = "feat/derived_embedding" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
ruint = "=1.17.0"
