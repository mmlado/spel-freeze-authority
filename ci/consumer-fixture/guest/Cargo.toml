[package]
name = "consumer-fixture-guest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "consumer_fixture"
path = "src/bin/consumer_fixture.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "8183b011b1a00dbc73ca9209f6b902c622d899af" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", tag = "v0.1.3" }
freeze-authority = { git = "https://github.com/mmlado/spel-freeze-authority.git", tag = "v0.1.4" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
ruint = "=1.17.0"
