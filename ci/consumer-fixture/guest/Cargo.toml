[package]
name = "consumer-fixture-guest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "consumer_fixture"
path = "src/bin/consumer_fixture.rs"

[dependencies]
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "f7aa464b2c6c72ef513a25ede16584bca85b722f" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", rev = "30f75226373ec6cee23d997b399c46174bc6560e" }
freeze-authority = { git = "https://github.com/mmlado/spel-freeze-authority.git", branch = "m3" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
ruint = "=1.17.0"
