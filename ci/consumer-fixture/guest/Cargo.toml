[package]
name = "consumer-fixture-guest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "consumer_fixture"
path = "src/bin/consumer_fixture.rs"

[dependencies]
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "3d8307391b86786b7027e1fdd871ae6d37ccf321" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", rev = "25cdbd9de6f5d27a5665d9ebe29c202da0405fed" }
freeze-authority = { git = "https://github.com/mmlado/spel-freeze-authority.git", branch = "feat/derived_embedding" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
ruint = "=1.17.0"
