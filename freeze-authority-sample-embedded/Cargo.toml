[package]
name = "freeze-authority-sample-embedded"
version = "0.1.0"
edition.workspace = true
lints.workspace = true

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "13e22bc39866cfcc68084484bed758b472a93e3e" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", rev = "519e456e2416c721f409ca8ee285000e8ed882fe" }
freeze-authority = { path = "../freeze-authority" }

[dev-dependencies]
spel-framework-core = { git = "https://github.com/mmlado/spel.git", rev = "13e22bc39866cfcc68084484bed758b472a93e3e", features = ["idl-gen"] }
