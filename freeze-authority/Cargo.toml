[package]
name = "freeze-authority"
version = "0.1.0"
edition.workspace = true
lints.workspace = true

[package.metadata.spel]
extension_attr = "freeze_authority"

[package.metadata.spel.wrap_instructions]
wrapper = "freeze_authority::require_not_frozen"
skip = "manual"
self_exempt_marker = "freeze_exempt"
exempt = [
  "admin_authority::admin_initialize",
  "admin_authority::admin_transfer",
  "admin_authority::admin_renounce",
]

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", branch = "feat/wrap_instructions" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", branch = "m2_freeze" }
freeze-authority-macros = { path = "../freeze-authority-macros" }
