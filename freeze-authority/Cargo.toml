[package]
name = "freeze-authority"
version = "0.1.0"
edition.workspace = true
lints.workspace = true

[package.metadata.spel]
extension_attr = "freeze_authority"

[package.metadata.spel.wrap_instructions]
wrapper = "freeze_authority::require_not_frozen"
skip = "manual"
self_exempt_marker = "freeze_exempt"
exempt = [
  "admin_authority::admin_initialize",
  "admin_authority::admin_transfer",
  "admin_authority::admin_renounce",
]

[[package.metadata.spel.inject]]
wrapper = "require_not_frozen"

  [[package.metadata.spel.inject.account]]
  name = "freeze_config"
  seed = { const = "freeze_config" }

  [[package.metadata.spel.inject.account]]
  name = "freeze_account"
  seed = [{ const = "frozen" }, { account = "caller" }]

  [[package.metadata.spel.inject.account]]
  name = "caller"
  signer = true

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "c701b7836494f73be46c4e38d8fb1e27d0dfe6f6" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", rev = "d92f63d20b8ff4731e2f5ca60d43501f3b4d0dfb" }
freeze-authority-macros = { path = "../freeze-authority-macros" }
authority = { git = "https://github.com/mmlado/spel-authority.git", rev = "b106e00eb85b51de6c42d7d9f24a624f60d6a38f", package = "spel-authority" }
