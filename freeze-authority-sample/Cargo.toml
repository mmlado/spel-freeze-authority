[package]
name = "freeze-authority-sample"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
spel-framework = { git = "https://github.com/mmlado/spel.git", rev = "98752095f45d405469f572668cd744c317fb8dad" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }
admin-authority = { git = "https://github.com/mmlado/spel-admin-authority.git", rev = "2085e49d9385c6155e7e77be5cf502a4286ce6c9" }
freeze-authority = { path = "../freeze-authority" }

[dev-dependencies]
spel-framework-core = { git = "https://github.com/mmlado/spel.git", rev = "98752095f45d405469f572668cd744c317fb8dad", features = ["idl-gen"] }